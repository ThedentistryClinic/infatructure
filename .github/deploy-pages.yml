# Deploy web/ to GitHub Pages on every push to main.
# Repository settings needed (see README "GitHub Pages"):
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions:
#     secrets: SUPABASE_URL, SUPABASE_ANON_KEY   (anon / publishable key ONLY)
#     variables: APP_BASE_URL  e.g. https://<user>.github.io/<repo>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate web/js/env.js (refuses secret keys)
        run: node scripts/generate-env.mjs production
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
